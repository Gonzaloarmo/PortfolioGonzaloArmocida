<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armo Design · UX/UI Designer</title>
<meta name="description" content="Armo Design. UX/UI design portfolio by Gonzalo.">
<meta name="theme-color" content="#1b1640">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/fondo.png">
<style>
:root{
  --ink:#1b1640;--line:#2c1e5e;--lav:#8f7fe0;--lav2:#b9adff;--peach:#ff9f86;--cream:#f6eee3;
  --px:3px;--u:1px;
  --cur:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='38' viewBox='0 0 13 19'><polygon points='1,1 1,15 4.5,12 7,17.5 9,16.5 6.5,11.5 11,11.5' fill='%23f6eee3' stroke='%231b1640' stroke-width='1.3' stroke-linejoin='miter' shape-rendering='crispEdges'/></svg>") 2 2, default;
  --cur-hand:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='38' viewBox='0 0 13 19'><polygon points='1,1 1,15 4.5,12 7,17.5 9,16.5 6.5,11.5 11,11.5' fill='%23ff9f86' stroke='%231b1640' stroke-width='1.3' stroke-linejoin='miter' shape-rendering='crispEdges'/></svg>") 2 2, pointer;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--cream);font-family:"VT323",ui-monospace,monospace;cursor:var(--cur);-webkit-tap-highlight-color:transparent}
a{color:var(--lav2)}
a:hover{color:var(--peach)}
button,a{cursor:var(--cur-hand);font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:3px solid var(--peach);outline-offset:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

.pbox{--b:var(--lav);--s:var(--ink);box-shadow:
  0 calc(var(--px)*-1) 0 0 var(--b),0 var(--px) 0 0 var(--b),
  calc(var(--px)*-1) 0 0 0 var(--b),var(--px) 0 0 0 var(--b),
  calc(var(--px)*2) calc(var(--px)*3) 0 0 var(--s),calc(var(--px)*3) calc(var(--px)*2) 0 0 var(--s)}

.btn{font-family:"Silkscreen",monospace;font-size:13px;letter-spacing:.02em;background:var(--line);color:var(--cream);border:0;padding:7px 12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
.btn:hover{background:var(--lav);color:var(--ink)}
.btn:active{transform:translate(2px,2px)}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;overflow:hidden;background:#000;z-index:30;cursor:var(--cur-hand)}
#cam{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#cam.zoom{transition:transform 1.3s cubic-bezier(.65,0,.35,1)}
#cam video{width:100%;height:100%;object-fit:cover;display:block}
#screen{position:absolute;container-type:size;display:grid;place-items:center;pointer-events:none}
#hello{text-align:center;text-shadow:.35cqw .35cqw 0 var(--line),.6cqw .6cqw 0 var(--ink)}
#hello p{margin:0;white-space:nowrap}
#hello.out{opacity:0;transition:opacity .2s steps(3)}
.h1{font-family:"Silkscreen",monospace;font-weight:700;font-size:6.4cqw;line-height:1;color:var(--cream);letter-spacing:.02em;min-height:1em}
.h2{margin-top:.35em!important;font-size:3.1cqw;line-height:1;color:var(--lav2);min-height:1em}
.caret{display:inline-block;width:.5em;height:.82em;margin-left:.1em;vertical-align:-.04em;background:currentColor;box-shadow:3px 3px 0 var(--line);animation:blink 1s steps(1) infinite}
#hint{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);margin:0;font-family:"Silkscreen",monospace;font-size:13px;color:var(--cream);text-shadow:2px 2px 0 var(--ink);white-space:nowrap;pointer-events:none;animation:blink 1.2s steps(1) infinite}
#hint.out{animation:none;opacity:0}
@keyframes blink{50%{opacity:0}}
#skip{position:fixed;z-index:50;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));font-size:14px;padding:9px 14px}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:45;background:#000;overflow:hidden;display:grid;place-items:center}
#boot.out{animation:fadeOut .32s steps(4) forwards}
@keyframes fadeOut{to{opacity:0}}
.crt{position:absolute;inset:0;background:var(--ink);transform:scale(0,.004);animation:crt .5s steps(8) forwards}
@keyframes crt{0%{transform:scale(0,.004);background:var(--cream)}35%{transform:scale(1,.004);background:var(--lav2)}60%{background:var(--lav)}100%{transform:scale(1,1);background:var(--ink)}}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.26) 0 2px,transparent 2px 4px);animation:flick .24s steps(2) infinite}
@keyframes flick{50%{opacity:.75}}

/* ---------- desktop ---------- */
#desk{position:fixed;inset:0;overflow:hidden;background:#3e3c9b;opacity:0;visibility:hidden;z-index:10}
#desk.show{opacity:1;visibility:visible;transition:opacity .5s steps(5)}
#stage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100vh*1672/940));width:max(100vw,calc(100dvh*1672/940));aspect-ratio:1672/940;transform:translate(-50%,-50%);background:#3e3c9b}
#icons{position:absolute;inset:0}
#mlayer{position:absolute;inset:0;pointer-events:none;--u:.62px}
#mlayer #icons{pointer-events:auto}

.icon{position:absolute;width:calc(var(--u)*156);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12);background:none;border:0;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.icon img{width:100%;height:auto;aspect-ratio:1;display:block;image-rendering:pixelated;pointer-events:none}
.icon .art{width:62%;display:block;pointer-events:none;filter:drop-shadow(calc(var(--u)*6) calc(var(--u)*6) 0 rgba(27,22,64,.7))}
.icon .art svg{width:100%;height:auto}
.icon:focus-visible{outline:none}
.icon:focus-visible img,.icon:focus-visible .art{outline:3px dashed var(--peach);outline-offset:4px}
.icon.drag{z-index:5;cursor:var(--cur-hand)}
.icon.drag img,.icon.drag .art{transform:translate(calc(var(--u)*-3),calc(var(--u)*-3))}
.icon.arr{transition:left .35s steps(6),top .35s steps(6)}
.label{--px:max(2px,calc(var(--u)*3));font-family:"Silkscreen",monospace;font-size:max(11px,calc(var(--u)*17));line-height:1.1;padding:calc(var(--u)*4) calc(var(--u)*10);background:var(--line);color:var(--cream);white-space:nowrap}
.icon.sel .label{background:var(--peach);color:var(--ink)}
.icon.sel .label.pbox{--b:var(--ink)}
.marquee{position:absolute;z-index:15;border:2px dashed var(--lav2);background:rgba(143,127,224,.16);pointer-events:none}

/* ---------- dock ---------- */
.dock-btn{position:absolute;top:90.213%;width:3.11%;height:5.319%;display:grid;place-items:center;background:transparent;border:0;padding:0;text-decoration:none;color:var(--ink)}
.dock-btn .glyph{font-family:"Silkscreen",monospace;font-weight:700;font-size:max(13px,calc(var(--u)*21));line-height:1}
.dock-btn:hover .glyph,.dock-btn:focus-visible .glyph{color:var(--line);transform:translateY(calc(var(--u)*-3))}
.dock-btn:hover,.dock-btn:focus-visible{background:rgba(246,238,227,.18)}
.dock-btn:focus-visible{outline-offset:2px}
.dock-btn.run::after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-10);width:max(4px,calc(var(--u)*6));height:max(4px,calc(var(--u)*6));transform:translateX(-50%);background:var(--peach);box-shadow:0 0 0 2px var(--ink)}
.tip{--px:2px;position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);font-family:"Silkscreen",monospace;font-size:12px;color:var(--cream);background:var(--line);padding:4px 8px;white-space:nowrap;visibility:hidden;pointer-events:none}
.dock-btn:hover .tip,.dock-btn:focus-visible .tip{visibility:visible;animation:pop .12s steps(2)}
@keyframes pop{from{transform:translate(-50%,4px)}to{transform:translate(-50%,0)}}
.slot{--px:max(2px,calc(var(--u)*3));--b:var(--lav);background:var(--line);animation:slotIn .2s steps(3)}
.slot:hover,.slot:focus-visible{background:#3b2c7c}
.slot img,.slot .sart{width:68%;pointer-events:none;image-rendering:pixelated}
.slot .sart svg{width:100%;height:auto}
.slot.min img,.slot.min .sart{opacity:.6}
@keyframes slotIn{from{transform:translateY(40%);opacity:0}}

/* ---------- menubar & menus ---------- */
#menubar{position:absolute;top:0;left:0;right:0;z-index:50;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:var(--line);border-bottom:3px solid var(--ink);box-shadow:inset 0 2px 0 #3d2f80}
.mb-left,.mb-right{display:flex;align-items:center;height:100%}
.mb-left{gap:2px}
.mb-right{gap:14px;padding-right:6px;font-family:"Silkscreen",monospace;font-size:12px}
.mb-btn{height:24px;padding:0 10px;border:0;background:transparent;font-family:"Silkscreen",monospace;font-size:12px;color:var(--cream);display:flex;align-items:center}
.mb-btn:hover,.mb-btn.on{background:var(--lav);color:var(--ink)}
.mb-btn:focus-visible{outline-offset:-3px}
.mb-logo{padding:0 5px}
.mb-logo svg{width:22px;height:22px}
.mb-ico svg{width:18px;height:14px}
#date{color:var(--lav2)}
#menus{position:absolute;inset:0;pointer-events:none;z-index:60}
.menu{--b:var(--lav);position:absolute;pointer-events:auto;min-width:230px;padding:4px;background:var(--line);display:flex;flex-direction:column;animation:menuIn .12s steps(3)}
@keyframes menuIn{from{clip-path:inset(-12px -12px 100% -12px)}to{clip-path:inset(-12px)}}
.menu [role=menuitem]{display:flex;justify-content:space-between;align-items:center;gap:24px;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;font-family:"Silkscreen",monospace;font-size:12px;color:var(--cream)}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus{background:var(--peach);color:var(--ink);outline:none}
.menu kbd{font-family:"VT323",monospace;font-size:18px;color:var(--lav2)}
.menu [role=menuitem]:hover kbd,.menu [role=menuitem]:focus kbd{color:var(--ink)}
.msep{height:3px;margin:4px 6px;background:var(--ink)}

/* ---------- notification ---------- */
#notif{--b:var(--lav);position:absolute;z-index:55;right:24px;bottom:24px;display:flex;align-items:flex-start;gap:12px;width:min(350px,calc(100vw - 40px));padding:12px;background:var(--line);animation:notifIn .24s steps(4)}
#notif.out{animation:notifOut .2s steps(3) forwards}
@keyframes notifIn{from{transform:translateY(24px);opacity:0}}
@keyframes notifOut{to{transform:translateY(24px);opacity:0}}
#notif .glogo svg{width:38px;height:38px}
#notif strong{display:block;font-family:"Silkscreen",monospace;font-weight:400;font-size:13px;color:var(--cream)}
#notif p{margin:4px 0 0;font-size:21px;line-height:1.05;color:var(--lav2)}
.nx{margin-left:auto;flex:none;width:26px;height:26px;border:0;background:var(--ink);color:var(--lav2);font-family:"Silkscreen",monospace;font-size:12px}
.nx:hover{color:var(--peach)}

/* ---------- windows ---------- */
#windows{position:absolute;inset:0;pointer-events:none;z-index:20}
body.dragging iframe{pointer-events:none}
body.dragging{user-select:none}
.win{--px:4px;--b:var(--line);position:absolute;display:flex;flex-direction:column;background:var(--ink);pointer-events:auto;min-width:300px;min-height:200px}
.win.closing{animation:winOut .14s steps(3) forwards}
@keyframes winIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes winOut{to{transform:scale(.6);opacity:0}}
.win:focus-visible{outline:3px solid var(--peach);outline-offset:8px}
.bar{display:flex;align-items:center;gap:8px;height:40px;flex:none;padding:0 8px 0 10px;background:var(--lav);color:var(--ink);border-bottom:4px solid var(--line);font-family:"Silkscreen",monospace;font-size:15px;cursor:var(--cur-hand);touch-action:none;user-select:none}
.win:not(.front) .bar{background:#9d93d6;color:var(--line)}
.bar img,.bar .bico{width:24px;height:24px;image-rendering:pixelated;flex:none}
.bar .bico svg{width:100%;height:100%}
.bar .at{width:24px;height:24px;display:grid;place-items:center;background:var(--line);color:var(--lav2);font-weight:700;flex:none}
.bar .title{flex:1;min-width:0;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:28px;height:26px;flex:none;display:grid;place-items:center;padding:0;border:0;background:var(--lav2);color:var(--ink);font-family:"Silkscreen",monospace;font-weight:700;font-size:14px;line-height:1;box-shadow:0 0 0 2px var(--line),inset -3px -3px 0 #7b6cc9,inset 3px 3px 0 var(--cream)}
.wbtn:hover{background:var(--cream)}
.wbtn:active{box-shadow:0 0 0 2px var(--line),inset 3px 3px 0 #7b6cc9,inset -3px -3px 0 var(--cream)}
.wbtn.wclose:hover{background:var(--peach)}
.wmin i{display:block;width:12px;height:3px;margin-top:8px;background:var(--ink)}
.wmax i{display:block;width:12px;height:10px;border:2px solid var(--ink);border-top-width:4px}
.win.max .wmax i{width:10px;height:8px;box-shadow:3px -3px 0 -1px var(--lav2),3px -3px 0 1px var(--ink)}
.nav{display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--line);flex:none;border-bottom:4px solid var(--ink)}
.nbtn{width:32px;height:30px;flex:none;border:0;background:var(--ink);color:var(--lav2);font-size:22px;line-height:1;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--lav)}
.nbtn:hover{color:var(--peach)}
.nbtn:active{transform:translate(1px,1px)}
.url{flex:1;min-width:0;height:30px;display:flex;align-items:center;padding:0 10px;background:var(--ink);color:var(--cream);font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 0 0 0 2px var(--lav)}
.url span{color:var(--lav)}
.open{flex:none;height:30px;display:flex;align-items:center;padding:0 12px;background:var(--peach);color:var(--ink);text-decoration:none;font-family:"Silkscreen",monospace;font-size:13px;box-shadow:inset -3px -3px 0 #d9755e}
.open:hover{color:var(--ink);background:#ffb7a4}
.open:active{transform:translate(1px,1px)}
.wbody{position:relative;flex:1;min-height:0;background:var(--ink);overflow:hidden}
.wbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ink);font-family:"Silkscreen",monospace;font-size:16px;color:var(--lav2)}
.loading p{margin:0}
.lbar{width:168px;height:20px;padding:3px;box-shadow:inset 0 0 0 3px var(--lav)}
.lbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--peach) 0 13px,transparent 13px 16px);animation:load 1.4s steps(10) infinite}
@keyframes load{to{width:100%}}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--ink);overflow:auto}
.card{--b:var(--lav);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:360px;padding:28px 28px 26px;background:var(--line)}
.card img{width:156px;height:156px;image-rendering:pixelated}
.card h2{margin:8px 0 0;font-family:"Silkscreen",monospace;font-size:24px;font-weight:400;color:var(--cream)}
.card p{margin:0 0 10px;font-size:24px;line-height:1.1;color:var(--lav2);text-wrap:pretty}
.card .btn,.pane .btn,.mail .btn{background:var(--peach);color:var(--ink);font-size:14px;padding:9px 14px}
.card .btn:hover,.pane .btn:hover,.mail .btn:hover{background:#ffb7a4}
.card .btn.pbox,.pane .btn.pbox,.mail .btn.pbox{--b:var(--ink)}
.grip{position:absolute;right:0;bottom:0;width:22px;height:22px;z-index:2;cursor:nwse-resize;touch-action:none;background:var(--line)}
.grip::after{content:"";position:absolute;right:4px;bottom:4px;width:3px;height:3px;background:var(--lav2);box-shadow:-5px 0 var(--lav2),-10px 0 var(--lav2),0 -5px var(--lav2),0 -10px var(--lav2),-5px -5px var(--lav2)}
.win.max .grip{display:none}
.win.max{left:8px!important;top:38px!important;width:calc(100vw - 16px)!important;height:calc(100% - 46px)!important}

.pane{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.pane h2{margin:0;font-family:"Silkscreen",monospace;font-weight:400;font-size:22px;color:var(--cream)}
.pane p{margin:0;font-size:24px;line-height:1.1;color:var(--lav2);text-wrap:pretty;max-width:30ch}
.pane .big svg{width:84px;height:auto}
.pane .btn{margin-top:6px}
.notes{position:absolute;inset:0;overflow:auto;padding:18px 22px;background:var(--cream);color:var(--ink);font-size:25px;line-height:1.15}
.notes p{margin:0;white-space:pre-wrap;text-wrap:pretty}
.mail{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px 24px}
.mail p{margin:0;font-size:22px;color:var(--lav2)}
.addr{font-size:28px;color:var(--cream);word-break:break-all;user-select:all}
.mail .btn{margin-top:6px}
.mail .ok{min-height:22px;color:var(--peach)}

@media (max-width:699px){
  .mb-hide{display:none!important}
  .win{left:0!important;top:33px!important;width:100vw!important;height:calc(100% - 33px)!important;min-width:0;box-shadow:none}
  .grip,.wmax{display:none}
  .bar{height:48px}
  .wbtn{width:40px;height:36px}
  .nbtn,.open,.url{height:40px}
  #hint{bottom:84px}
  #notif{right:16px;left:16px;width:auto;bottom:calc(13% + 12px)}
}
/* ---------- scene ---------- */
#scene{position:absolute;inset:0}
.layer{position:absolute;inset:0;will-change:transform}
#lyBg,#lySky,#lyDock{left:-2%;top:-2%;width:104%;height:104%}
#lyBg{transition:filter 2.5s ease}
#bgImg,#bgFx,#skyFx{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;pointer-events:none;user-select:none}
#lySky,#lyDock{pointer-events:none}
#lySky{transition:opacity 1.2s steps(6)}
#lyDock .dock-btn{pointer-events:auto}
#tint{position:absolute;inset:0;pointer-events:none}
#tint i{position:absolute;inset:0;opacity:0;transition:opacity 3s ease}
.t-night{background:linear-gradient(180deg,rgba(18,12,58,.5),rgba(27,22,64,.22));mix-blend-mode:multiply}
.t-sunset{background:linear-gradient(215deg,rgba(255,159,134,.6) 0%,rgba(255,159,134,.24) 34%,rgba(255,159,134,.08) 62%,transparent 85%);mix-blend-mode:screen}
.t-dawn{background:linear-gradient(0deg,rgba(255,168,200,.34),rgba(255,190,214,.12) 60%,rgba(255,190,214,.04));mix-blend-mode:screen}
.t-day{background:rgba(246,238,227,.16);mix-blend-mode:screen}
.t-konami{background:linear-gradient(180deg,rgba(160,212,255,.4),rgba(246,238,227,.38));mix-blend-mode:screen}
#desk[data-tod=night] .t-night,#desk[data-tod=sunset] .t-sunset,#desk[data-tod=dawn] .t-dawn,#desk[data-tod=day] .t-day{opacity:1}
#desk[data-tod=day] #lyBg{filter:saturate(.72) brightness(1.08)}
#desk.daymode #lyBg{filter:hue-rotate(-42deg) saturate(.75) brightness(1.65) contrast(.9);transition:filter 1.2s steps(6)}
#desk.daymode #tint i{opacity:0;transition:opacity 1.2s steps(6)}
#desk.daymode #tint .t-konami{opacity:1}
#desk.daymode #lySky{opacity:0}

#moon{position:absolute;left:19%;top:10%;width:5%;height:10%;background:transparent;border:0;padding:0}
#moon:focus-visible{outline-offset:2px}
#fullMoon{position:absolute;left:calc(282/1672*100%);top:calc(62/940*100%);width:calc(156/1672*100%);aspect-ratio:1;pointer-events:none;animation:moonIn .3s steps(3)}
#fullMoon svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:auto}
#fullMoon .halo1{width:100%;opacity:.13}
#fullMoon .halo2{width:84.6%;opacity:.22}
#fullMoon .disc{width:64.1%}
@keyframes moonIn{from{transform:scale(.7);opacity:0}}

#cat{position:absolute;left:calc(112/1672*100%);top:calc(735/940*100%);width:calc(80/1672*100%);background:none;border:0;padding:0}
#cat .cat-art{display:block;transform-origin:50% 100%;transition:transform .3s steps(3)}
#cat .cat-art svg{width:100%;height:auto}
#cat.stretch .cat-art{transform:scale(1.18,.86)}
.zzz{position:absolute;left:6%;bottom:80%;width:60%;height:200%;pointer-events:none}
.zzz i{position:absolute;left:0;bottom:0;font-family:"Silkscreen",monospace;font-style:normal;font-size:max(9px,calc(var(--u)*16));line-height:1;color:var(--lav2);text-shadow:1px 1px 0 var(--ink);opacity:0;animation:zzz 3.6s steps(9) infinite}
.zzz i:nth-child(2){animation-delay:1.2s}

@keyframes zzz{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(var(--u)*22),calc(var(--u)*-48))}}
#cat.awake .zzz{display:none}
.heart{position:absolute;left:18%;bottom:85%;width:26%;opacity:0;pointer-events:none}
.heart svg{width:100%;height:auto}
#cat.love .heart{animation:heart 1.1s steps(6) forwards}
@keyframes heart{0%{opacity:0;transform:translateY(0)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--u)*-36))}}

/* ---------- icons motion ---------- */
.ico-in{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*12);width:100%;pointer-events:none}

  .icon:hover .art{animation:glintA .12s steps(2)}
}
@keyframes glint{from{filter:brightness(1.7)}to{filter:brightness(1)}}
@keyframes glintA{from{filter:brightness(1.7) drop-shadow(calc(var(--u)*6) calc(var(--u)*6) 0 rgba(27,22,64,.7))}to{filter:brightness(1) drop-shadow(calc(var(--u)*6) calc(var(--u)*6) 0 rgba(27,22,64,.7))}}

#pv{--px:3px;--b:var(--line);position:absolute;z-index:19;width:240px;background:var(--ink);pointer-events:none;animation:pvIn .15s steps(3)}
#pv.out{animation:pvOut .15s steps(3) forwards}

@keyframes pvOut{to{transform:translateY(8px) scale(.85);opacity:0}}
.pv-bar{height:24px;display:flex;align-items:center;padding:0 8px;background:var(--lav);color:var(--ink);font-family:"Silkscreen",monospace;font-size:12px;border-bottom:3px solid var(--line)}

.loading .static{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.loading p{--b:var(--lav);position:relative;padding:6px 12px;background:var(--ink)}

.term{position:absolute;inset:0;overflow:auto;padding:12px 16px 16px;background:var(--ink);color:var(--lav2);font-size:22px;line-height:1.15;cursor:text}

}

}
const ART = {};
ART.g = (() => {
  const n = 11, g = [...Array(n)].map((_, y) => [...Array(n)].map((_, x) => (x === 0 || y === 0 || x === n - 1 || y === n - 1 ? 'K' : 'L')));

ART.trash = ['....KKKKKK....', 'KKKKKHHHHKKKKK', 'KHHHHHHHHHHHHK', 'KKKKKKKKKKKKKK', ...Array(9).fill('.KLLHLLHLLHLK.'), '.KKKKKKKKKKKK.'];
ART.term = ['KKKKKKKKKKKKKK', 'KLLLLLLLLLPLHK', 'KKKKKKKKKKKKKK', 'KOOOOOOOOOOOOK', 'KOHOOOOOOOOOOK', 'KOOHOOOOOOOOOK',
  'KOHOOPPPOOOOOK', 'KOOOOOOOOOOOOK', 'KOOOOOOOOOOOOK', 'KKKKKKKKKKKKKK'];
ART.vol = ['...C.....', '..CC..C..', 'CCCC...C.', 'CCCC.C.C.', 'CCCC...C.', '..CC..C..', '...C.....'];

ART.wifi = ['.CCCCCCC.', 'C.......C', '..CCCCC..', '.C.....C.', '...CCC...', '.........', '....C....'];

/* ---------- sound (Web Audio, off by default) ---------- */
const sfx = (() => {

  try { on = localStorage.getItem('gos-sound') === '1'; } catch (e) {}

    if (!on) return null;

      if (!AC) return null;

      master.gain.value = 0.9;

/* static noise for loading windows */
const STATIC_PAL = [[27, 22, 64], [44, 30, 94], [44, 30, 94], [143, 127, 224], [185, 173, 255], [246, 238, 227]];
const statics = new Set();

  staticRAF = statics.size ? requestAnimationFrame(staticLoop) : 0;
  if (t - staticLast < 70) return;
  staticLast = t;

}
function drawNoise(s) {
  const d = s.img.data, w = 160, h = 100;
  s.off = (s.off + 3) % h;
  for (let y = 0; y < h; y++) {
    const band = (y + s.off) % 34 < 5 || (s.tune && (y + s.off * 2) % 17 < 4);
    for (let x = 0; x < w; x++) {
      const r = Math.random();
      const c = STATIC_PAL[band ? (r < 0.6 ? 4 : r < 0.85 ? 3 : 5) : r < 0.55 ? 0 : r < 0.85 ? 1 : r < 0.97 ? 3 : 4];
      const i = (y * w + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  s.ctx.putImageData(s.img, 0, 0);
}
function startStatic(canvas) {
  const ctx = canvas.getContext('2d'), s = { ctx, img: ctx.createImageData(160, 100), off: 0, canvas };
  statics.add(s);
  drawNoise(s);
  if (!reduce.matches && !staticRAF) staticRAF = requestAnimationFrame(staticLoop);
  return s;
}
function stopStatic(s) { if (s) statics.delete(s); }
function tune(win, s, done) {
  const loading = win.querySelector('.loading'), body = win.querySelector('.wbody');
  if (reduce.matches) return done();
  if (s) s.tune = true;
  loading.classList.add('tune');
  body.animate([{ transform: 'none' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px) skewX(3deg)' }, { transform: 'translateX(-2px)' }, { transform: 'none' }],
    { duration: 300, easing: 'steps(5, end)' });
  const a = loading.animate([{ opacity: 1 }, { opacity: 0.35 }, { opacity: 0.9 }, { opacity: 0.2 }, { opacity: 0 }], { duration: 300, easing: 'steps(5, end)', fill: 'forwards' });
  a.onfinish = () => { done(); a.cancel(); loading.classList.remove('tune'); if (s) s.tune = false; };
}

      </div>`,
    body: `<iframe title="${p.name} website" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="loading" role="status"><canvas class="static" width="160" height="100" aria-hidden="true"></canvas><p class="pbox">Loading</p></div>
      <div class="fallback" hidden><div class="card pbox">
        <img src="${p.icon}" alt="" width="156" height="156">
        <h2>${p.name}</h2><p>${p.desc}</p>
        <a class="btn pbox" href="${p.url}" target="_blank" rel="noopener">Open site ↗</a>
      </div></div>`,
  });
  if (!win) return;
  const iframe = win.querySelector('iframe'), loading = win.querySelector('.loading'), fb = win.querySelector('.fallback'), canvas = loading.querySelector('canvas');
  let noise = null;
  const endLoad = () => { if (noise) { stopStatic(noise); noise = null; busy(-1); } };
  win._endLoad = endLoad;
  const finish = (fallback) => {
    clearTimeout(win._timer);
    tune(win, noise, () => {
      endLoad();
      loading.hidden = true;
      if (fallback) { fb.hidden = false; iframe.removeAttribute('src'); iframe.hidden = true; }
    });
  };
  const load = () => {
    clearTimeout(win._timer);
    loading.hidden = false;
    fb.hidden = true;
    if (!noise) { noise = startStatic(canvas); busy(1); }
    if (inPreview) { win._timer = setTimeout(() => finish(true), 1100); return; }
    iframe.hidden = false;
    win._timer = setTimeout(() => finish(true), 6000);
    iframe.onload = () => { if (iframe.getAttribute('src') && noise) finish(false); };
    iframe.onerror = () => finish(true);
    iframe.src = p.url;
  };
  win.querySelector('.reload').addEventListener('click', () => { iframe.removeAttribute('src'); load(); });
  load();
}

/* ---------- terminal ---------- */
const PROMPT = 'visitor@gonzalo-os:~$';
function openTerminal() {
  const win = openWin({ id: 'term', title: 'Terminal', w: 640, h: 420, from: iconEl('term'), icon: svgIcon('term'), slotIcon: svgSlot('term'),
    body: `<div class="term"><div class="tout" role="log" aria-live="off"></div>
      <form class="tline" autocomplete="off"><label class="prompt" for="termIn">${PROMPT}</label>
      <input id="termIn" class="tin" type="text" spellcheck="false" autocapitalize="off" aria-label="Terminal command"></form></div>` });
  if (!win) { const w = wins.get('term'); if (w) w.querySelector('.tin').focus(); return; }
  const term = win.querySelector('.term'), out = win.querySelector('.tout'), form = win.querySelector('form'), input = win.querySelector('.tin');
  const hist = [];
  let hi = 0, queue = Promise.resolve();
  const typeLine = (text, cls) => new Promise((res) => {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    out.appendChild(line);
    const fin = () => { term.scrollTop = term.scrollHeight; announce(text); res(); };
    if (reduce.matches) { line.textContent = text; return fin(); }
    let i = 0;
    const step = () => {
      i += Math.max(1, Math.ceil(text.length / 60));
      line.textContent = text.slice(0, i);
      term.scrollTop = term.scrollHeight;
      if (i < text.length) setTimeout(step, 14); else fin();
    };
    step();
  });
  const print = (text, cls) => (queue = queue.then(() => typeLine(text, cls)));
  const then = (fn) => (queue = queue.then(fn));
  const echo = (cmd) => { const l = document.createElement('div'); l.className = 'echo'; l.textContent = `${PROMPT} ${cmd}`; out.appendChild(l); term.scrollTop = term.scrollHeight; };
  const findOpen = (n) => {
    const p = CONFIG.projects.find((q) => q.id === n || q.name.toLowerCase() === n);
    if (p) return [p.name, () => openProject(p)];
    const s = { about: ['About me.txt', openNotes], 'about.txt': ['About me.txt', openNotes], cv: ['CV.pdf', openCV], 'cv.pdf': ['CV.pdf', openCV], trash: ['Trash', openTrash], mail: ['Mail', openMail] }[n];
    return s || null;
  };
  const run = (raw) => {
    const cmd = raw.trim();
    echo(cmd);
    if (!cmd) return;
    hist.push(cmd); hi = hist.length;
    const parts = cmd.toLowerCase().split(/\s+/), c = parts[0], arg = parts.slice(1).join(' ');
    switch (c) {
      case 'help': case 'ayuda':
        ['Available commands:', '  projects      list my projects', '  open <name>   open a project (try: open terrace)', '  about         a little about me',
          '  contact       how to reach me', '  date          today’s date and time', '  clear         clear the screen', '  ...and one more, if you have sudo.'].forEach((l) => print(l));
        break;
      case 'projects': case 'proyectos':
        CONFIG.projects.forEach((p) => print(`  ${p.id.padEnd(10)}${p.desc}`));
        print('Type "open terrace" to launch one.');
        break;
      case 'open': case 'abrir': {
        const f = findOpen(arg);
        if (f) { print(`Opening ${f[0]}...`); then(() => f[1]()); }
        else print(`open: "${arg}" not found. Try: ${CONFIG.projects.map((p) => p.id).join(', ')}`, 'err');
        break;
      }
      case 'about': case 'sobre-mi': print(CONFIG.about); break;
      case 'contact': case 'contacto':
        print(`email     ${CONFIG.mail}`); print(`behance   ${CONFIG.behance}`); print(`linkedin  ${CONFIG.linkedin}`);
        break;
      case 'date': case 'fecha':
        print(new Date().toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }));
        break;
      case 'clear': case 'cls': then(() => { out.innerHTML = ''; }); break;
      case 'exit': then(() => closeWin(win)); break;
      case 'sudo':
        if (/^(hire|hire me|contratar)$/.test(arg)) {
          print('[sudo] password for visitor: ********');
          then(() => { sfx.tada(); confetti(win); });
          print(`Permission granted. Write to me: ${CONFIG.mail}`, 'ok');
        } else print('visitor is not in the sudoers file. Nice try.', 'err');
        break;
      default: print(`command not found: ${c}. Type "help".`, 'err');
    }
  };
  form.addEventListener('submit', (e) => { e.preventDefault(); const v = input.value; input.value = ''; run(v); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(0, hi - 1); input.value = hist[hi] || ''; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; }
  });
  term.addEventListener('click', () => { if (!getSelection().toString()) input.focus(); });
  print('Gonzalo OS terminal v1.0');
  print('Type "help" to see what I can do.');
  input.focus({ preventScroll: true });
}
function confetti(win) {
  if (reduce.matches) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  c.width = Math.ceil(innerWidth / 3); c.height = Math.ceil(innerHeight / 3);
  fxTop.appendChild(c);
  const ctx = c.getContext('2d'), r = win.getBoundingClientRect(), ox = (r.left + r.width / 2) / 3, oy = (r.top + 60) / 3;
  const cols = ['#ff9f86', '#b9adff', '#8f7fe0', '#f6eee3', '#ffd27a'];
  const ps = [...Array(90)].map(() => ({ x: ox, y: oy, vx: (Math.random() - 0.5) * 7, vy: -Math.random() * 6 - 2, c: cols[(Math.random() * cols.length) | 0], s: Math.random() < 0.3 ? 2 : 1 }));
  const start = performance.now();
  let last = 0;
  const loop = (t) => {
    if (t - start > 1900) return c.remove();
    requestAnimationFrame(loop);
    if (t - last < 33) return;
    last = t;
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach((p) => { p.vy += 0.32; p.vx *= 0.98; p.x += p.vx; p.y += p.vy; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
  };
  requestAnimationFrame(loop);
}

const KONAMI = ['arrowup', 'arrowup', 'arrowdown', 'arrowdown', 'arrowleft', 'arrowright', 'arrowleft', 'arrowright', 'b', 'a'];
let konamiI = 0;
function toggleDay() {
  const on = desk.classList.toggle('daymode');

/* ---------- global ---------- */
const MOD = ['Tab', 'Shift', 'Control', 'Alt', 'Meta', 'CapsLock'];
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (openM) { e.preventDefault(); closeMenus(true); return; }
    if (phase === 'off') return;
    if (phase !== 'desk') { e.preventDefault(); skipAll(); return; }
    const w = frontWin();
    if (w) { e.preventDefault(); closeWin(w); }
    return;
  }
  if (phase === 'intro') {
    if (MOD.includes(e.key) || e.target === skip) return;
    e.preventDefault();
    zoom();
    return;
  }
  if (phase !== 'desk') return;
  if (!(e.target.matches && e.target.matches('input, textarea'))) {
    const k = e.key.toLowerCase();
    konamiI = k === KONAMI[konamiI] ? konamiI + 1 : k === KONAMI[0] ? 1 : 0;
    if (konamiI === KONAMI.length) { konamiI = 0; toggleDay(); }
  }
  if (!openM && !isMobile() && (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) && !e.target.closest('.win')) {
    e.preventDefault();
    const a = e.target.closest && e.target.closest('.icon');
    const r = a ? a.getBoundingClientRect() : { left: innerWidth / 2, bottom: innerHeight / 2 };
    openMenu(CTX, { x: r.left, y: r.bottom });
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { sceneStop(); pvVid.pause(); sfx.stopHum(); }
  else if (phase === 'desk') { sceneStart(); sfx.startHum(); }
});
let rz;
addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => {
    closeMenus();
    hidePreview();
    placeScreen();
    layout();
    wins.forEach((w) => {
      w.style.left = clamp(w.offsetLeft, -w.offsetWidth + 100, innerWidth - 100) + 'px';
      w.style.top = clamp(w.offsetTop, 34, innerHeight - 44) + 'px';
    });
  });
});

const clock = $('#clock'), dateEl = $('#date');
function tick() {
  const d = new Date();
  clock.textContent = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  clock.dateTime = d.toISOString();
  dateEl.textContent = d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/[.,]/g, '');
  timeOfDay();
}
tick();
setInterval(tick, 10000);

hideDesk();
layout();
if (reduce.matches || store.get()) showDesk();
else startIntro();
