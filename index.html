<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gonzalo Armocida - Portfolio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%238f7fe0'/%3E%3Crect x='1' y='1' width='14' height='14' fill='%232c1e5e'/%3E%3Cpath fill='%23f6eee3' d='M5 3h6v2H5zM3 5h2v6H3zM5 11h6v2H5zM11 8h2v3h-2zM8 8h3v2H8z'/%3E%3C/svg%3E">
<meta name="description" content="Armo Design. UX/UI design portfolio by Gonzalo.">
<meta name="theme-color" content="#1b1640">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/fondo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="sr-only">Armo Design. Gonzalo, UX/UI Designer. Portfolio</h1>

<section id="intro" aria-label="Animated intro">
  <div id="cam">
    <video id="introVideo" muted playsinline preload="auto" poster="assets/intro-poster.jpg" aria-hidden="true">
      <source src="assets/intro.mp4" type="video/mp4">
      <source src="assets/intro.webm" type="video/webm">
    </video>
    <div id="screen"><div id="hello" aria-hidden="true">
      <p class="h1"><span id="t1"></span></p>
      <p class="h2"><span id="t2"></span></p>
    </div></div>
  </div>
  <p id="hint" aria-hidden="true">Click or press any key to power on</p>
</section>

<div id="boot" hidden>
  <div class="crt"></div>
  <div class="scan" aria-hidden="true"></div>
</div>

<div id="off" hidden>
  <button id="powerOn" class="btn" type="button">Click to power on</button>
</div>

<button id="skip" class="btn pbox" type="button" hidden>Skip intro</button>
<div id="musicWrap" class="vol-wrap"><span class="vol pbox"><input id="volBottom" type="range" min="0" max="100" step="1" value="20" aria-label="Music volume"></span><button id="music" type="button" aria-pressed="true" aria-label="Music" title="Music"><svg viewBox="0 0 12 10" width="20" height="17" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 3h2v4H0zM2 3h1v4H2zM3 2h1v6H3zM4 1h1v8H4zM5 0h1v10H5z"/><g class="on"><path fill="currentColor" d="M7 4h1v2H7zM8 2h1v1H8zM9 3h1v4H9zM8 7h1v1H8zM10 1h1v1h-1zM11 2h1v6h-1zM10 8h1v1h-1z"/></g><g class="off"><path fill="currentColor" d="M7 3h1v1H7zM8 4h1v1H8zM9 5h1v1H9zM10 6h1v1h-1zM10 3h1v1h-1zM9 4h1v1H9zM8 5h1v1H8zM7 6h1v1H7z"/></g></svg></button></div>
<audio id="bgm" src="assets/music.mp3" loop preload="auto"></audio>

<main id="desk" aria-label="Gonzalo OS desktop">
  <div id="stage">
    <!-- Parallax scene: every .layer moves by its data-depth (1 = 1% of the stage width).
         #lyBg is a single image for now. To split it later, add one .layer per plane
         (sky ~0.3, clouds ~0.5, city ~0.7, balcony ~1.2, plant ~1.5) using the same 104% box. -->
    <div id="scene">
      <div class="layer" id="lyBg" data-depth="0">
        <img id="bgImg" src="assets/fondo.png" alt="" width="1672" height="940" draggable="false">
        <canvas id="bgFx" width="836" height="470" aria-hidden="true"></canvas>
        <span id="fullMoon" aria-hidden="true" hidden></span>
        <button id="moon" type="button" aria-pressed="false" aria-label="Moon. Double-click or press Enter to change its phase"></button>
        <button id="cat" type="button" aria-label="Sleeping cat. Press Enter to wake it up">
          <span class="cat-art"></span>
          <span class="zzz" aria-hidden="true"><i>z</i><i>z</i><i>z</i></span>
          <span class="heart" aria-hidden="true"></span>
        </button>
      </div>
      <div class="layer" id="lySky" data-depth="0"><canvas id="skyFx" width="836" height="470" aria-hidden="true"></canvas></div>
      <div id="tint" aria-hidden="true"><i class="t-night"></i><i class="t-sunset"></i><i class="t-dawn"></i><i class="t-day"></i><i class="t-konami"></i></div>
    </div>
    <div class="layer" id="lyDock" data-depth="0">
      <nav id="dock" aria-label="Dock">
        <a class="dock-btn" id="dockBehance" style="left:44.258%" href="#" target="_blank" rel="noopener" aria-label="Behance (opens in a new tab)"><span class="glyph">Be</span><span class="tip pbox" aria-hidden="true">Behance</span></a>
        <a class="dock-btn" id="dockLinkedin" style="left:48.565%" href="#" target="_blank" rel="noopener" aria-label="LinkedIn (opens in a new tab)"><span class="glyph">in</span><span class="tip pbox" aria-hidden="true">LinkedIn</span></a>
        <button class="dock-btn" id="dockMail" style="left:52.871%" type="button" aria-label="Mail"><span class="glyph">@</span><span class="tip pbox" aria-hidden="true">Mail</span></button>
        <div id="slots"></div>
      </nav>
    </div>
    <div id="icons" class="layer" data-depth="0" role="group" aria-label="Desktop icons"></div>
  </div>
  <div id="mlayer"></div>

  <div id="pv" hidden aria-hidden="true">
    <div class="pv-bar"><span class="pv-title"></span></div>
    <video muted loop playsinline preload="none"></video>
  </div>

  <div id="menubar">
    <div class="mb-left">
      <button class="mb-btn mb-logo" type="button" data-menu="g" aria-haspopup="menu" aria-expanded="false" aria-label="Gonzalo OS menu"><span data-art="g"></span></button>
      <button class="mb-btn mb-hide" type="button" data-menu="file" aria-haspopup="menu" aria-expanded="false">File</button>
      <button class="mb-btn mb-hide" type="button" data-menu="view" aria-haspopup="menu" aria-expanded="false">View</button>
      <button class="mb-btn mb-hide" type="button" data-menu="help" aria-haspopup="menu" aria-expanded="false">Help</button>
    </div>
    <div class="mb-right">
      <span class="vol-wrap vol-top mb-hide"><button id="sound" class="mb-btn" type="button" aria-pressed="false" aria-label="Music"></button><span class="vol pbox"><input id="volTop" type="range" min="0" max="100" step="1" value="20" aria-label="Music volume"></span></span>
      <span class="mb-ico mb-hide" data-art="wifi" title="Wifi"></span>
      <span id="date" class="mb-hide"></span>
      <time id="clock"></time>
    </div>
  </div>

  <div id="windows"></div>
  <div id="fxTop" aria-hidden="true"></div>

  <div id="notif" class="pbox" role="status" hidden>
    <span class="glogo" data-art="g"></span>
    <div><strong id="notifTitle">Welcome to Gonzalo OS</strong><p id="notifBody">Double-click a project to open it.</p></div>
    <button class="nx" type="button" aria-label="Close notification">x</button>
  </div>

  <div id="menus"></div>
</main>

<div id="live" class="sr-only" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
